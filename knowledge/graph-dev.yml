# Knowledge Graph — Development Subgraph
# Solutions, dead-ends, patterns, tools from software development.
# Written by /sync. Read for context restoration and debugging.

entities:
  beat-editor-backup-system:
    type: solution
    repo: dezibel-editor
    date: 2026-03-31
    problem: "Browser-based editor risked data loss from accidental navigation, storage limits, or crashes"
    solution: "5-layer backup (localStorage, sessionStorage, auto-save, tab-lock beforeunload, storage monitoring) with launch script for consistent startup"
    files:
      - editor/beat-editor-loaded.html
      - tools/auto-backup.sh
      - editor/launch.sh
  sync-skill-sandbox-fix:
    type: dead-end
    repo: brain
    date: 2026-03-31
    problem: "Sync skill used piped shell commands that fail in Claude Code sandbox"
    resolution: "Removed piped command; sandbox does not support arbitrary shell piping in skill scripts"
    files:
      - .claude/skills/the-brain/sync/SKILL.md
  three-act-to-five-act-correction:
    type: solution
    repo: dezibel-editor
    date: 2026-04-01
    problem: "Entire repo used 3-act structure but the narrative is actually 5 acts"
    root_cause: "Original scaffolding assumed 3-act; story evolved beyond that"
    fix: "Corrected 54 files across characters, themes, strategy, story docs to 5-act structure"
    files:
      - story/outline/act-outline.md
      - strategy/plan-to-launch.md
  story-map-editor-replaces-beat-editor:
    type: dead-end
    repo: dezibel-editor
    date: 2026-04-02
    tried: "beat-editor-loaded.html as the canonical editor (3,442 lines)"
    failed_because: "Story map editor proved more capable — horizontal kanban view, prose injection, bulletproofing systems all built there. Maintaining two editors was unsustainable."
    replaced_by: "artifacts/readable/dezibel-story-map.html as single canonical editor"
  sprint-orchestrator-nested-session:
    type: dead-end
    repo: dezibel-editor
    date: 2026-04-04
    tried: "run-research-sprint skill — bash orchestrator spawning nested claude CLI subprocesses for 5-phase research"
    failed_because: "claude CLI can't spawn inside another Claude Code session (CLAUDECODE env var blocks nested sessions). Recon phase burned $8.68 but returned empty output."
    replaced_by: "Direct Agent tool calls with parallel agents — achieved same research scope without nested sessions"
  jargon-heavy-investor-docs:
    type: dead-end
    repo: dezibel-editor
    date: 2026-04-05
    tried: "Research-agent-generated copy in strategy docs — coined terms ('The Living Room', 'The Pulse', 'The Monument', 'temporal parallel-experience platform', 'ecology'), academic jargon ('collective effervescence', 'constrained expression'), hype framing ('the stadium is where the magic is')"
    failed_because: "Investor-facing docs must be plain language. Overwrought copy undermines credibility. Research informs strategy — it doesn't become the copy. The community is not the product; the story is."
    replaced_by: "Complete rewrite from scratch — plain language, function and quality, no coined terms. Both markdown and styled HTML/PDF regenerated."
  vizibel-naming:
    type: dead-end
    repo: dezibel-editor
    date: 2026-04-05
    tried: "Using 'Vizibel' as the community space name"
    failed_because: "Correct name is 'Invizibel' — consistent with the -IBEL naming family (Indivizibel, Dezibel, Invizibel)"
    replaced_by: "Invizibel across all docs, HTML, and PDFs"
  delivery-narrowed-to-app-plus-sms:
    type: dead-end
    repo: brain
    date: 2026-04-07
    tried: "Narrowed delivery description from multi-channel (SMS/app/WhatsApp) to 'dedicated app with 1-3 SMS triggers' in investor docs"
    failed_because: "Delivery channel is undecided research. Brain optimized for investor concreteness over accuracy and propagated the error across overview doc, financial leave-behind, and daily notes. The actual experience is dozens of messages per day, channel TBD."
    replaced_by: "Restored multi-channel description. Delivery channel flagged as open research question."
  day-publish-pipeline-bridge:
    type: solution
    repo: dezibel-editor
    date: 2026-05-06
    problem: "Story map editor and story/days/ files were completely decoupled — prose written in browser had no path to day file format that Python audit tools read"
    root_cause: "Editor and day files were built in parallel to solve different problems (structuring vs delivery), bridge was never prioritized during the month of editor development"
    fix: "DayPublish module inside story map HTML — exports beat prose to YAML-frontmatter markdown using showDirectoryPicker() for directory access. Automatic backup to .backups/ before overwrite. Preserves created dates on re-export. Auto-derives status, bubble count, flags, speaker color codes from editor state."
    files:
      - artifacts/readable/dezibel-story-map.html
      - story/days/README.md
  editor-prose-injection:
    type: solution
    repo: dezibel-editor
    date: 2026-04-02
    problem: "Story beats existed as structural outlines without actual prose — editor couldn't show writing progress"
    root_cause: "Prose lived in master-doc, not in the beat-level editor"
    fix: "Injected 7,236 lines of master doc prose into story map beats for Days 1-23. Editor now shows actual writing alongside structural beats."
    files:
      - artifacts/readable/dezibel-story-map.html
  875k-fundraise-plan:
    type: dead-end
    domain: development
    title: "$875K fundraise plan — front-loaded scaling costs"
    project: "Dezibel"
    date: "2026-05-12"
    daily_note: "[[2026-05-12]]"
    tried: "Built an $875K fundraise plan by stacking every line item at premium rates and including scaling costs (marketing $150-300K, full website $40-60K, tech support $60K) in the launch budget. Presented to Michael Tippett as the target raise."
    failed_because: "Tippett reacted negatively — $875K triggers institutional-grade scrutiny from individuals and sounds disconnected for a 'book project.' The plan didn't separate launch costs from scale costs. Budget lines were inherited from prior documents without market rate verification. Each reduction ($500K, $325K, $125K) was achieved by loading more work onto the founder rather than re-researching actual costs."
    replaced_by: "Researched $285K minimum raise with every line item verified against 2025-2026 market data. Revenue waterfall phases growth through earned revenue."
  producer-equity-5-8-percent:
    type: dead-end
    domain: development
    title: "5-8% producer equity — disproportionate to investor deal"
    project: "Dezibel"
    date: "2026-05-13"
    daily_note: "[[2026-05-13]]"
    tried: "Suggested 5-8% equity (or 3-5% revenue share) for a producer hired at $35K cash for 5.5 months. This gave a short-term hire a better deal per dollar than the investor putting in $292K for a capped 8% return."
    failed_because: "At $100M scale, 8% equity = $8M for ~$20-45K in forgone salary. The investor's $292K only returns a capped $584K. Nobody should get a better deal per dollar than the person funding the operation. Claude pulled from 'typical startup ranges' without cross-referencing against the specific deal structure."
    replaced_by: "1-2% equity vesting 24 months (1-year cliff), or performance equity 1%→3% at milestones. Proportional to salary discount. Created mandatory financial cross-reference protocol."
  browser-storage-false-redundancy:
    type: dead-end
    domain: development
    title: "4 browser-storage backup layers presented as independent redundancy"
    project: "Dezibel"
    date: "2026-05-13"
    daily_note: "[[2026-05-13]]"
    tried: "Built 5 editor backup layers — localStorage auto-save, rolling localStorage backup, IndexedDB SnapshotVault, FileLink (disk), DayPublish (disk). Presented as 'quintuple redundancy' to the user, claiming writing was safe."
    failed_because: "Layers 1-3 all live in browser storage. Clearing Chrome data kills all three simultaneously. They share a failure domain — depth without diversity. FileLink and DayPublish (the only disk-based layers) were opt-in and silent when disconnected. Four locks on the same door."
    replaced_by: "Disk-first persistence — saveState() writes to FileLink before browser storage. Prose panel blocked without file linked. Non-dismissible banner forces file linking on startup."
  write-lock-false-positive:
    type: solution
    domain: development
    title: "Write-lock false positive triggers block overlay"
    project: "Dezibel"
    date: "2026-05-28"
    daily_note: "[[2026-05-28]]"
    problem: "Fast typing in ME (800ms auto-save) caused writeToFile to return false due to _writeLock, which saveState treated as permission failure — showing block overlay and closing prose panel during normal operation"
    root_cause: "writeToFile returned false for both 'no handle' and 'write locked' — caller couldn't distinguish expected lock-skip from genuine permission failure"
    fix: "writeToFile returns 'locked' string for lock-skip. saveState callback ignores 'locked', only shows block overlay on genuine false (permission failure)."
  missing-permission-gates-editor-entries:
    type: solution
    domain: development
    title: "Missing FileLink permission gates on editor entry points"
    project: "Dezibel"
    date: "2026-05-28"
    daily_note: "[[2026-05-28]]"
    problem: "meStartEdit and openProse had no FileLink permission check — after sleep/wake, permission expires silently and user types into a textarea that only saves to localStorage, not disk"
    root_cause: "Permission gate existed on toggleProsePanel but not on the functions it calls. openProse callers (meGoToBoard) didn't await the now-async function."
    fix: "Made meStartEdit and openProse async with permission gates. saveCurrentProse runs BEFORE permission check (don't lose existing prose), new beat setup runs AFTER. meGoToBoard awaits openProse instead of setTimeout hack."
  linear-audit-false-confidence:
    type: dead-end
    domain: development
    title: "Linear code reading for bug auditing"
    project: "Dezibel"
    date: "2026-05-28"
    daily_note: "[[2026-05-28]]"
    tried: "Reading the editor file linearly top-to-bottom to find bugs — produced 'no bugs found' reports that were later proven wrong"
    failed_because: "Linear reading evaluates each function in isolation. Bugs live at interaction boundaries — what happens when function A's return value is misinterpreted by function B, or when async timing creates a race. Reading A and B separately shows nothing wrong with either."
    replaced_by: "Adversarial scenario tracing — pick hostile user scenarios (sleep/wake, rapid typing, tab switch, quota full) and trace each through the full code path. Found 4 bugs that linear reading missed."
